name: Update RBI Exchange Rate

on:

  schedule:

    # Every weekday 8:30 UTC
    # 2:00 PM IST

    - cron: "30 8 * * 1-5"

  workflow_dispatch:

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5

        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scripts/update.py

      - name: Commit

        run: |

          git config user.name github-actions

          git config user.email github-actions@github.com

          git add .

          git diff --cached --quiet || git commit -m "Daily exchange rate update"

          git push
